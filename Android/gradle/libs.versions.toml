[versions]
agp = "9.5.1"
# Before upgrading, check the new OkHttp AAR's minCompileSdk (in
# META-INF/com/android/build/gradle/aar-metadata.properties). 5.5.1 requires apps to compile against
# API 37, which would force every app using Davy to do the same; 5.3.2 requires nothing.
okhttp = "5.3.2"
junit = "4.13.2"
json = "20260814"
snakeyaml = "2.7"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
