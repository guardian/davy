openapi: 3.1.0
info:
  title: Davy events
  version: 3.0.0
  license:
    name: Apache License, Version 2.0
    identifier: Apache-2.0
  summary: The requests Davy clients send to your endpoint, and the responses they act on.
  description: |
    The contract between Davy clients and the endpoint that receives their events. Every client
    sends `POST` requests to the configured `endpoint` with up to `batchSize` (default 100) events
    from a single session as a JSON body, so events from every platform can be queried together.
    The Swift client for Apple platforms and the Kotlin client for Android implement it, and their
    tests check their requests against it and against the shared examples in `fixtures.json`.

    Rules this document can't express:

    - Every request includes the headers in `DavyConfiguration.headers`, except `Content-Type`,
      `User-Agent`, and `Accept-Language`, which Davy always sets. Requests never send cookies or
      use a local cache.
    - Each event, measured as the UTF-8 byte length of a single-event JSON request body with the
      session data, is at most `maxEventSize` bytes (default 4,096). A larger event is replaced
      with the error `davy_event_too_large`.
    - Delivery is at least once, so the same event can arrive more than once with the same ID.
    - `timestamp` and `sent_at` come from the device's clock, which can be wrong. `sent_at` is set
      each time a request is sent, so a retry has a later `sent_at` than the attempt before it. If
      the clock is off, compare `sent_at` with when the server received the request to estimate by
      how much, and shift `timestamp` by the same amount. Events can arrive up to `maxEventAge`
      (default 30 days) after they were logged.
    - A client keeps at most `maxPendingEvents` (default 1,000) events waiting to be sent, and
      discards the oldest beyond that, so after a long outage the earliest events can be missing.

    The schemas are strict so clients can be checked against them. Servers should be lenient and
    ignore fields they don't recognize, since a client discards the events in any request rejected
    with 400.
servers:
  - url: https://api.example.com
    description: |
      An example server. The path `/events` is for the example endpoint
      `https://api.example.com/events`. For your own, replace this URL with your endpoint's scheme
      and host, and `/events` with your endpoint's path, as set in `DavyConfiguration.endpoint`.
# Davy doesn't require authentication. Apps can add headers, such as `Authorization`, with
# `DavyConfiguration.headers`.
security: []
paths:
  /events:
    post:
      operationId: sendBatch
      summary: Send a batch of events
      description: |
        Sent to the endpoint itself, without adding a trailing slash. Contains between 1 and
        `batchSize` (default 100) events, oldest first, all logged in the same session. One request
        is in flight at a time.
      parameters:
        - name: User-Agent
          in: header
          required: true
          description: |
            Always `Davy`, never the system's default `User-Agent`, which would name the OS build or
            device model.
          schema:
            type: string
            const: Davy
        - name: Accept-Language
          in: header
          required: true
          description: |
            Always `*`, never the user's preferred languages, which would fingerprint the device.
          schema:
            type: string
            const: '*'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
            example:
              sent_at: '2026-11-09T11:39:00.250Z'
              session:
                id: 6F9619FF-8B86-D011-B42D-00C04FC964FF
                environment: production
                app_version: 1.2.0
                build: 45
                os: ios
                os_version: 26.1.0
                device_model: iPhone17,1
                locale: en_GB
                info:
                  edition: uk
                  tier: supporter
              events:
                - id: 1B4E28BA-2FA1-11D2-883F-0016D3CCA427
                  type: breadcrumb
                  name: checkout_started
                  timestamp: '2026-11-09T11:38:55.780Z'
                - id: 9C5B94B1-35AD-49BB-B118-8E8FC24ABF80
                  type: error
                  name: payment_declined
                  info:
                    reason: card_expired
                    attempt: 2
                    cpu_percent: 12
                    memory_used_mb: 143
                    memory_available_mb: 2650
                    thermal_state: nominal
                    low_power_mode: false
                  timestamp: '2026-11-09T11:38:57.112Z'
      responses:
        '2XX':
          $ref: '#/components/responses/Stored'
        '400':
          $ref: '#/components/responses/Rejected'
        '413':
          $ref: '#/components/responses/Rejected'
        '414':
          $ref: '#/components/responses/Rejected'
        '422':
          $ref: '#/components/responses/Rejected'
        '429':
          $ref: '#/components/responses/Throttled'
        '431':
          $ref: '#/components/responses/Rejected'
        '503':
          $ref: '#/components/responses/Throttled'
        default:
          $ref: '#/components/responses/Retried'
components:
  schemas:
    Batch:
      type: object
      description: The body of a request.
      required: [sent_at, session, events]
      additionalProperties: false
      properties:
        sent_at:
          $ref: '#/components/schemas/SentAt'
        session:
          $ref: '#/components/schemas/Session'
        events:
          type: array
          description: Oldest first, all logged in `session`.
          minItems: 1
          items:
            $ref: '#/components/schemas/Event'
    Session:
      type: object
      description: |
        Coarse data about the app and device, captured once when a session starts. Nothing here
        identifies a person or a device across sessions. Events left over from a previous launch are
        sent with the session they were logged in.
      required: [id, os, os_version]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/SessionId'
        environment:
          $ref: '#/components/schemas/Environment'
        app_version:
          $ref: '#/components/schemas/AppVersion'
        build:
          $ref: '#/components/schemas/Build'
        os:
          $ref: '#/components/schemas/OS'
        os_version:
          $ref: '#/components/schemas/OSVersion'
        device_model:
          $ref: '#/components/schemas/DeviceModel'
        locale:
          $ref: '#/components/schemas/Locale'
        info:
          $ref: '#/components/schemas/Info'
    Event:
      type: object
      description: A breadcrumb or error logged by the app.
      required: [id, type, name, timestamp]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        type:
          $ref: '#/components/schemas/EventType'
        name:
          $ref: '#/components/schemas/EventName'
        info:
          $ref: '#/components/schemas/Info'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    UUID:
      type: string
      format: uuid
      description: A UUID in uppercase.
      pattern: '^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$'
    EventId:
      $ref: '#/components/schemas/UUID'
      description: |
        A random UUID generated when the event is logged and sent unchanged with every retry, so the
        server can discard duplicates.
      examples: [9C5B94B1-35AD-49BB-B118-8E8FC24ABF80]
    SessionId:
      $ref: '#/components/schemas/UUID'
      description: |
        A random UUID generated when the client is created, typically once per launch, and never
        reused. Links events within a session, but not across sessions or to a device.
      examples: [6F9619FF-8B86-D011-B42D-00C04FC964FF]
    EventType:
      type: string
      description: Whether something happened (`breadcrumb`) or went wrong (`error`).
      enum: [breadcrumb, error]
    EventName:
      type: string
      minLength: 1
      description: |
        A short, stable name chosen by the app, for example `checkout_started`. Names should be
        lower snake case, matching `^[a-z][a-z0-9]*(_[a-z0-9]+)*$`, but clients only check this when
        configured to with `onInvalidEventName`, so other names can arrive.

        Davy logs these names itself:

        - `davy_invalid_event_name`: an error sent in place of an event with an invalid name, with
          the name in `info` under `rejected_name`.
        - `davy_event_too_large`: an error sent in place of an event over `maxEventSize`, with its
          name under `rejected_name` and its size in bytes under `size`.
        - `app_foregrounded` and `app_backgrounded`: breadcrumbs logged when
          `logsAppLifecycleEvents` is set.
      examples: [checkout_started, payment_declined]
    Info:
      type: object
      description: |
        Details as strings, numbers, and Booleans, omitted when empty. Numbers are integers or
        decimals; integers beyond ±2^53 can lose precision in some JSON parsers. Clients can write
        the same decimal differently, for example `2` or `2.0`, and `1e-07` or `1.0E-7`, so read
        numbers by value, and don't infer from a whole number that a key only holds integers. Keys
        are chosen by the app, apart from these:

        - Diagnostics, added to every error. They vary by platform. On Apple platforms they are
          `cpu_percent`, `memory_used_mb`, `memory_available_mb` (omitted where there's no memory
          limit), `thermal_state` (`nominal`, `fair`, `serious`, or `critical`), and
          `low_power_mode`. On Android they are `cpu_percent` (averaged since the previous error or
          launch), `memory_used_mb` (Java and native heap), `memory_available_mb` (Java heap left),
          `thermal_state` (`none`, `light`, `moderate`, `severe`, `critical`, `emergency`, or
          `shutdown`, on Android 10 and later), and `low_power_mode` (whether Battery Saver is on).
          The CPU and memory values are integers, `thermal_state` is a string, and
          `low_power_mode` is a Boolean.
        - `error_type`: the type of an error logged from a platform error, such as a Swift `Error`
          or a Kotlin `Throwable`, but not its description, as a string.
        - `duration_ms`: how long a measured operation took, as an integer number of milliseconds.
        - `rejected_name` (a string) and `size` (an integer): see `davy_invalid_event_name` and
          `davy_event_too_large`.

        Decimals that JSON can't represent, infinity and NaN, are sent as the strings `inf`,
        `-inf`, and `nan`.
      minProperties: 1
      additionalProperties:
        type: [string, number, boolean]
      examples:
        - reason: card_expired
          attempt: 2
          cpu_percent: 12
          memory_used_mb: 143
          memory_available_mb: 2650
          thermal_state: nominal
          low_power_mode: false
    Timestamp:
      type: string
      format: date-time
      description: When the event was logged, by the device's clock, as ISO 8601 in UTC with milliseconds.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      examples: ['2026-11-09T11:38:57.112Z']
    SentAt:
      type: string
      format: date-time
      description: |
        When the request was sent, by the device's clock, in the same format as `timestamp`. Set
        again for every attempt, so it's the same for every event in a request but differs between
        retries. Compare it with when the server received the request to see how far the device's
        clock is from the server's.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      examples: ['2026-11-09T11:39:00.250Z']
    Environment:
      type: string
      description: |
        `DavyConfiguration.environment`, the kind of build sending events. Omitted when not set.
      examples: [debug, beta, production]
    AppVersion:
      type: string
      description: |
        The app's version: `CFBundleShortVersionString` on Apple platforms, or `versionName` on
        Android. Omitted when missing.
      examples: [1.2.0]
    Build:
      type: integer
      format: int64
      description: |
        The app's build number: `CFBundleVersion` on Apple platforms, or `versionCode` on Android.
        Omitted when missing, or on Apple platforms when `CFBundleVersion` isn't a whole number.
      examples: [45]
    OS:
      type: string
      description: The operating system.
      enum: [ios, macos, maccatalyst, visionos, tvos, watchos, android]
    OSVersion:
      type: string
      description: |
        The operating system version, as `major.minor.patch`, padded with zeros where the system
        reports fewer parts, so Android 15 is `15.0.0`.
      pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      examples: [26.1.0]
    DeviceModel:
      type: string
      description: |
        The device's model: the hardware model identifier on Apple platforms, or `Simulator`, and the
        model name on Android. Omitted when it can't be read.
      examples: ['iPhone17,1', 'Mac15,3', Simulator, Pixel 9]
    Locale:
      type: string
      description: |
        The device's language and region only, for example `en_GB`, or just the language if there's
        no region. Omitted when there's no language.
      pattern: '^[a-z]{2,3}(_([A-Z]{2}|[0-9]{3}))?$'
      examples: [en_GB, es_419, fr]
  headers:
    RetryAfter:
      description: |
        How long to pause, as a number of seconds or an HTTP date. An HTTP date is measured from the
        response's `Date` header when present. Pauses are at least 1 second and at most 24 hours,
        lengthened by up to 10% at random.
      schema:
        type: string
      examples:
        seconds:
          value: '120'
        date:
          value: Wed, 11 Nov 2026 12:00:00 GMT
  responses:
    Stored:
      description: The events are stored and removed from the device. The body is ignored.
    Rejected:
      description: |
        The server will never accept these events, so the client discards them rather than retrying,
        and they don't block the events behind them. Clients treat 400, 413, 414, 422, and 431 this
        way.
    Throttled:
      description: |
        The client sends nothing until the `Retry-After` delay ends, even when flushing or after a
        relaunch. The events are kept. Use it to slow down or pause clients, for example during an
        incident or a cost spike. Without a valid `Retry-After`, the events are retried with
        backoff instead.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    Retried:
      description: |
        Any other response, or no response at all, for example a network error, a 5xx response, or a
        401, 403, or 404 that likely means the endpoint is misconfigured. The events are kept, and
        the client retries with exponential backoff and jitter, starting at up to 5 seconds and
        doubling to at most 5 minutes.
